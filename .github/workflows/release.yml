name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Run tests
      run: make test

    - name: Build binaries
      run: |
        # Build for multiple platforms
        GOOS=linux GOARCH=amd64 go build -o bin/ecs-dev-linux-amd64 cmd/ecs-dev/main.go
        GOOS=linux GOARCH=arm64 go build -o bin/ecs-dev-linux-arm64 cmd/ecs-dev/main.go
        GOOS=darwin GOARCH=amd64 go build -o bin/ecs-dev-darwin-amd64 cmd/ecs-dev/main.go
        GOOS=darwin GOARCH=arm64 go build -o bin/ecs-dev-darwin-arm64 cmd/ecs-dev/main.go
        GOOS=windows GOARCH=amd64 go build -o bin/ecs-dev-windows-amd64.exe cmd/ecs-dev/main.go

    - name: Create checksums
      run: |
        cd bin
        sha256sum ecs-dev-* > checksums.txt
        cat checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bin/ecs-dev-linux-amd64
          bin/ecs-dev-linux-arm64
          bin/ecs-dev-darwin-amd64
          bin/ecs-dev-darwin-arm64
          bin/ecs-dev-windows-amd64.exe
          bin/checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
