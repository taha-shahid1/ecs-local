version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - goconst
    - gocyclo
    - dupl
  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 25
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: false
